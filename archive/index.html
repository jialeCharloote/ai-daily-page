<!doctype html>

<meta charset="utf-8">

<title>往期存档 — AI Daily</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">
<style>
  :root {
    --paper: #f5f7f4; --ink: #14171c; --ink-soft: #59616b; --ink-faint: #8a929c;
    --rule: #dde1da; --accent: #1a5fb4;
    --serif: Georgia, 'Times New Roman', 'Songti SC', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0f1216; --ink: #e7eae5; --ink-soft: #9aa3ad; --ink-faint: #6b737d;
            --rule: #262c33; --accent: #7fb0ee; }
  }
  :root[data-theme="dark"] { --paper: #0f1216; --ink: #e7eae5; --ink-soft: #9aa3ad;
                             --ink-faint: #6b737d; --rule: #262c33; --accent: #7fb0ee; }
  :root[data-theme="light"] { --paper: #f5f7f4; --ink: #14171c; --ink-soft: #59616b;
                              --ink-faint: #8a929c; --rule: #dde1da; --accent: #1a5fb4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .shell { max-width: 780px; margin: 0 auto; padding: 0 24px 80px; }
  .masthead { padding: 40px 0 20px; border-bottom: 2px solid var(--ink); }
  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
            text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px; }
  .wordmark { font-family: var(--serif); font-size: clamp(32px, 6vw, 44px); font-weight: 400;
              letter-spacing: -0.02em; line-height: 1; margin: 0; }
  .back { font-family: var(--mono); font-size: 12px; color: var(--accent);
          text-decoration: none; display: inline-block; margin-top: 18px; }
  .back:hover { text-decoration: underline; text-underline-offset: 3px; }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; padding: 0; margin: 8px 0 0; }
  li { border-bottom: 1px solid var(--rule); }
  li a { display: flex; gap: 16px; align-items: baseline; padding: 16px 0;
         text-decoration: none; color: var(--ink); }
  li a:hover .issue-date { color: var(--accent); text-decoration: underline;
                           text-underline-offset: 3px; }
  li a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .issue-date { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
  .issue-note { font-size: 13px; color: var(--ink-faint); }
  .empty { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); padding: 24px 0; }
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <p class="kicker">Archive · 北京时间 UTC+8</p>
    <h1 class="wordmark">往期存档</h1>
    <a class="back" href="../">← 回到最新一期</a>
  </header>

  <ul>
    <li>
      <a href="2026-08-06.html">
        <span class="issue-date">2026-08-06</span>
        <span class="issue-note">官方 2 · 新闻 1 · 视频 5 · X 8</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
